spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartdesk_ticket_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          ai-triage-service:
            connectTimeout: 3000
            readTimeout: 10000
            loggerLevel: basic

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  bootstrap:
    admin-name: ${ADMIN_NAME:}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}