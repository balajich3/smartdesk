spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ticket-service
              uri: http://localhost:8081
              predicates:
                - Path=/ticket-service/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/notification-service/**
              filters:
                - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/