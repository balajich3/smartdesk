server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React application and client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ticket Service REST API through API Gateway
    location /ticket-service/ {
        proxy_pass http://api-gateway:8080/ticket-service/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification Service WebSocket connection
    # This route goes directly to Notification Service.
    location /notification-service/ws-notifications {
        proxy_pass http://notification-service:8083/ws-notifications;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Notification Service REST API through API Gateway
    location /notification-service/ {
        proxy_pass http://api-gateway:8080/notification-service/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}